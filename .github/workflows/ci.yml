name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install shells if missing on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v zsh >/dev/null || ! command -v fish >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zsh fish
          fi
      - name: Install fish if missing on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if ! command -v fish >/dev/null; then
            brew install fish
          fi
      - name: Check formatting and lint
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --all-targets -- -D warnings
          fish -n shell/t.fish
          zsh -n shell/t.zsh
      - name: Run Rust tests
        run: cargo +stable test --locked --all-targets
      - name: Run interactive shell tests
        run: |
          cargo +stable build --locked
          python3 tests/fish_integration.py target/debug/t-helper
          python3 tests/zsh_integration.py target/debug/t-helper
